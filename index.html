<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面部疲劳监测系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #0a1628;
  --secondary: #1a2942;
  --accent: #00d4ff;
  --accent-dim: #0088aa;
  --success: #00ff88;
  --warning: #ffaa00;
  --danger: #ff4466;
  --text: #e8f4f8;
  --text-dim: #8899aa;
  --glass: rgba(26, 41, 66, 0.85);
}
body {
  font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, var(--primary) 0%, #0d1f3c 50%, #0a1628 100%);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }
#homeScreen { align-items: center; justify-content: center; padding: 40px 20px; }
.home-header { text-align: center; margin-bottom: 50px; }
.home-header h1 { font-size: 2.8rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), #66eeff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 12px; }
.home-header p { color: var(--text-dim); font-size: 1.1rem; max-width: 500px; line-height: 1.6; }
.btn { display: inline-block; padding: 12px 30px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; text-decoration: none; border: none; }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dim)); color: #fff; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 212, 255, 0.4); }
</style>
</head>
<body>
<div id="homeScreen" class="screen active">
  <div class="home-header">
    <h1>面部疲劳监测系统</h1>
    <p>基于计算机视觉的实时面部疲劳检测，帮助您保持最佳状态</p>
  </div>
  <button class="btn btn-primary" onclick="startDetection()">开始检测</button>
</div>
<script>
function startDetection() { alert("检测功能开发中..."); }
</script>
</body>
</html>
